name: HouseMove APK

on:
  push:
    paths:
      - "moving-app/**"
      - ".github/workflows/housemove-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: moving-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test
        run: ./gradlew :app:testDebugUnitTest
      - name: Build APK
        run: ./gradlew :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: HouseMove-apk
          path: moving-app/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
