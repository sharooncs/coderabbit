name: HouseMove iPhone

# Builds the iPhone app on GitHub's macOS runner and tests it in a simulator. Needs no secrets: signing and
# TestFlight uploads happen on the owner's Mac (moving-app/tools/ios.sh, design/ios-plan.md). The app's screens are
# Kotlin (moving-app/sharedUi, on top of moving-app/shared), built by Gradle inside the Xcode build, so changes there
# and to the Gradle setup run this too; shared's common tests run in the simulator first. Changes to the Android app
# alone (moving-app/app) do not run this; changes to moving-app/shared run this and the APK workflow both.
on:
  push:
    paths:
      - "moving-app/iosApp/**"
      - "moving-app/sharedUi/**"
      - "moving-app/shared/**"
      - "moving-app/build.gradle.kts"
      - "moving-app/settings.gradle.kts"
      - "moving-app/gradle.properties"
      - "moving-app/gradle/**"
      - "moving-app/gradlew"
      - "moving-app/tools/ios.sh"
      - "moving-app/tools/asc.swift"
      - "moving-app/tools/failures.py"
      - ".github/workflows/housemove-ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: housemove-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: xcode-27
    # The first run also downloads the Kotlin/Native toolchain and links the framework from scratch, and the shared
    # tests link a test program of their own.
    timeout-minutes: 90
    defaults:
      run:
        working-directory: moving-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          # Save the Gradle cache from this branch too (by default only the default branch writes it), so runs
          # do not fetch every library again and get turned away by Maven Central (HTTP 429).
          cache-read-only: false
      - name: Keep the Kotlin/Native toolchain between runs
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('moving-app/build.gradle.kts', 'moving-app/gradle.properties') }}
      - name: Look for the Android SDK (platform 37, build tools 36)
        id: sdk
        # The Android plugin needs them even for the iPhone build. The image's own SDK is used if it has both.
        run: |
          for d in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}" "$HOME/Library/Android/sdk"; do
            if [ -n "$d" ] && [ -d "$d/platforms/android-37.0" ] && [ -d "$d/build-tools/36.0.0" ]; then
              echo "On the image: $d"
              echo "ANDROID_HOME=$d" >> "$GITHUB_ENV"
              echo "found=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "Not on the image (ANDROID_HOME=${ANDROID_HOME:-unset}, ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset})"
          ls "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/nonexistent}}/platforms" 2>/dev/null || true
          echo "found=false" >> "$GITHUB_OUTPUT"
      - name: Install the Android SDK packages
        if: steps.sdk.outputs.found != 'true'
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: "platforms;android-37.0 build-tools;36.0.0"
          log-accepted-android-sdk-licenses: false
      - name: The App Store Connect helper compiles
        # It runs only on the owner's Mac (with the API key kept there); here it is only type-checked.
        run: xcrun swiftc -typecheck tools/asc.swift
      # The shared data and sync code's common tests (moving-app/shared/src/commonTest, with the golden fixtures of
      # 2.1.1) on the simulator the UI tests use: the code the iPhone runs, against the bytes and text Android phones
      # make. A failure does not stop the Xcode steps below, so one run tells everything; the job fails at the end.
      - name: Shared tests on the iPhone simulator
        id: shared-tests
        continue-on-error: true
        run: |
          export HM_SIMULATOR="$(tools/ios.sh sim-id)"
          echo "Simulator $HM_SIMULATOR"
          # --no-daemon: the Gradle daemon would keep its memory while Xcode and the simulator need it.
          ./gradlew --no-daemon :shared:iosSimulatorArm64Test
      - name: Keep the shared test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-shared-tests
          path: |
            moving-app/shared/build/reports/tests/iosSimulatorArm64Test
            moving-app/shared/build/test-results/iosSimulatorArm64Test
          if-no-files-found: ignore
      - name: XcodeGen
        run: |
          echo "HM_TOOLS=$RUNNER_TEMP/tools" >> "$GITHUB_ENV"
          HM_TOOLS="$RUNNER_TEMP/tools" tools/ios.sh setup xcodegen
      # The numbers the cloud session reads from this log: wall time and peak memory of compiling the Kotlin klibs,
      # linking the debug framework for the simulator and the release framework for the iPhone (each with
      # /usr/bin/time -l), the size of the Release app for the iPhone, and the required-reason APIs in it.
      # It takes about 18 minutes, so it runs only for a commit whose message says [measure] (workflow_dispatch
      # cannot be used: the default branch does not have this workflow).
      - name: Measure the Kotlin build
        if: contains(github.event.head_commit.message, '[measure]')
        run: tools/ios.sh measure
      - name: Build and test in the simulator
        run: tools/ios.sh sim
      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-shots
          path: moving-app/iosApp/build/shots
          if-no-files-found: ignore
      # Every failed test with its message and the start of its stack trace, here in the log: the shared tests from
      # Gradle's JUnit XML, the Xcode tests from the result bundle. When all passed, only the counts.
      - name: Failed tests
        if: always()
        run: |
          python3 tools/failures.py shared/build/test-results/iosSimulatorArm64Test --xcresult iosApp/build/sim.xcresult
      - name: The shared tests on the simulator must pass
        if: steps.shared-tests.outcome == 'failure'
        run: |
          echo "The shared tests failed on the iPhone simulator: see the step 'Failed tests' above, the step 'Shared tests on the iPhone simulator', and the ios-shared-tests artifact."
          exit 1

  # Copies the screenshots to the ci-shots branch, so they can be fetched with git and looked at.
  # The only job that may write to the repository; it pushes nothing else.
  shots:
    needs: simulator
    if: always() && needs.simulator.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ios-shots
          path: shots
      - name: Push to ci-shots
        env:
          TOKEN: ${{ github.token }}
        run: |
          [ -d shots ] || { echo "No screenshots this run"; exit 0; }
          cd shots
          printf 'Run %s\nCommit %s\nBranch %s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$GITHUB_REF_NAME" > RUN.txt
          git init -q -b ci-shots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "iPhone screenshots from run $GITHUB_RUN_ID ($GITHUB_SHA)"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:ci-shots
