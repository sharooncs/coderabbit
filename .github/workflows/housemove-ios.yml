name: HouseMove iPhone

# Builds the iPhone app on GitHub's macOS runner and tests it in a simulator. Needs no secrets:
# signing and TestFlight uploads happen on the owner's Mac (moving-app/tools/ios.sh, design/ios-plan.md).
on:
  push:
    paths:
      - "moving-app/iosApp/**"
      - "moving-app/tools/ios.sh"
      - ".github/workflows/housemove-ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: housemove-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: xcode-27
    timeout-minutes: 40
    defaults:
      run:
        working-directory: moving-app
    env:
      HM_TOOLS: ${{ runner.temp }}/tools
    steps:
      - uses: actions/checkout@v4
      - name: XcodeGen
        run: tools/ios.sh setup
      - name: Build and test in the simulator
        run: tools/ios.sh sim
      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-shots
          path: moving-app/iosApp/build/shots
          if-no-files-found: ignore

  # Copies the screenshots to the ci-shots branch, so they can be fetched with git and looked at.
  # The only job that may write to the repository; it pushes nothing else.
  shots:
    needs: simulator
    if: always() && needs.simulator.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ios-shots
          path: shots
      - name: Push to ci-shots
        env:
          TOKEN: ${{ github.token }}
        run: |
          [ -d shots ] || { echo "No screenshots this run"; exit 0; }
          cd shots
          printf 'Run %s\nCommit %s\nBranch %s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$GITHUB_REF_NAME" > RUN.txt
          git init -q -b ci-shots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "iPhone screenshots from run $GITHUB_RUN_ID ($GITHUB_SHA)"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:ci-shots
