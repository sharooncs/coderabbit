org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
kotlin.compiler.execution.strategy=in-process
# Maven Central sometimes answers 429 (too many requests): retry downloads more times, waiting longer between tries.
systemProp.org.gradle.internal.repository.max.retries=8
systemProp.org.gradle.internal.repository.initial.backoff=2000
# The iPhone side (Kotlin/Native, used by shared and sharedUi only). Its klibs compile on Linux too; only linking
# the framework needs a Mac. The Kotlin/Native compiler runs in a process of its own with 4 GB, so the Gradle
# daemon keeps the 3 GB above; the iPhone workflow's log prints what linking takes (housemove-ios.yml).
kotlin.native.enableKlibsCrossCompilation=true
# ... and the iPhone tests, which need a simulator, are skipped there without a warning on every build.
kotlin.native.ignoreDisabledTargets=true
kotlin.native.disableCompilerDaemon=true
kotlin.native.jvmArgs=-Xmx4g
