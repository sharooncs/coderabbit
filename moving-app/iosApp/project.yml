# The iPhone app's Xcode project, generated with XcodeGen (`xcodegen generate` in this folder,
# or `tools/ios.sh generate`). The .xcodeproj itself is not kept in git: edit this file instead.
# Plan and owner steps: design/ios-plan.md.
name: HouseMove
options:
  bundleIdPrefix: app.housemove
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    # The owner's Apple Developer team. Not a secret: it is printed inside every signed app.
    DEVELOPMENT_TEAM: USW8537DGX
    CODE_SIGN_STYLE: Automatic
    # 0.x while the iPhone app is a test shell; the first real version takes the Android version it syncs with.
    MARKETING_VERSION: "0.1"
    # tools/ios.sh sets this to the UTC time (yyyymmddHHMM) for every upload, so each one is higher.
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  HouseMove:
    type: application
    platform: iOS
    sources:
      - path: HouseMove
    # The screens are Kotlin (moving-app/sharedUi, Compose Multiplatform). Before Xcode compiles the Swift, Gradle
    # builds them as the static framework HouseMoveKit for this build's configuration and platform (Debug or Release,
    # simulator or iPhone) into sharedUi/build/xcode-frameworks, and copies their resources (the Outfit fonts) into the
    # app as compose-resources. JetBrains' "direct integration": kotlinlang.org/docs/multiplatform/multiplatform-direct-integration.html
    preBuildScripts:
      - name: Build the Kotlin screens (HouseMoveKit)
        # Every build: Gradle itself works out whether anything changed.
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "${OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED:-}" ]; then
            echo "Skipping Gradle: the IDE built the Kotlin framework already"
            exit 0
          fi
          # Xcode passes on no shell settings: unless JAVA_HOME and ANDROID_HOME are set, use the JDK 21 and the
          # Android SDK that tools/ios.sh setup installs (the Android plugin needs the SDK even for the iPhone build).
          TOOLS="${HM_TOOLS:-$HOME/Developer/tools}"
          if [ -z "${JAVA_HOME:-}" ] && [ -x "$TOOLS/jdk/Contents/Home/bin/java" ]; then
            export JAVA_HOME="$TOOLS/jdk/Contents/Home"
          fi
          if [ -z "${ANDROID_HOME:-}" ] && [ -d "$TOOLS/android-sdk/platforms" ]; then
            export ANDROID_HOME="$TOOLS/android-sdk"
          fi
          cd "$SRCROOT/.."
          ./gradlew :sharedUi:embedAndSignAppleFrameworkForXcode
    settings:
      base:
        PRODUCT_NAME: HouseMove
        PRODUCT_BUNDLE_IDENTIFIER: app.housemove.ios
        INFOPLIST_FILE: HouseMove/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        # Where Gradle puts HouseMoveKit, and linking it (static: its code becomes part of the app's own binary).
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../sharedUi/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "HouseMoveKit"
        # The Gradle step writes outside what a sandboxed script may (the Gradle cache, sharedUi/build, the app bundle).
        ENABLE_USER_SCRIPT_SANDBOXING: NO
  HouseMoveUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: HouseMoveUITests
    dependencies:
      - target: HouseMove
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.housemove.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: HouseMove
schemes:
  HouseMove:
    build:
      targets:
        HouseMove: all
        HouseMoveUITests: [test]
    test:
      config: Debug
      targets:
        - HouseMoveUITests
    archive:
      config: Release
