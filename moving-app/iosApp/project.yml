# The iPhone app's Xcode project, generated with XcodeGen (`xcodegen generate` in this folder,
# or `tools/ios.sh generate`). The .xcodeproj itself is not kept in git: edit this file instead.
# Plan and owner steps: design/ios-plan.md.
name: HouseMove
options:
  bundleIdPrefix: app.housemove
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    # The owner's Apple Developer team. Not a secret: it is printed inside every signed app.
    DEVELOPMENT_TEAM: USW8537DGX
    CODE_SIGN_STYLE: Automatic
    # 0.x while the iPhone app is a test shell; the first real version takes the Android version it syncs with.
    MARKETING_VERSION: "0.1"
    # tools/ios.sh sets this to the UTC time (yyyymmddHHMM) for every upload, so each one is higher.
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  HouseMove:
    type: application
    platform: iOS
    sources:
      - path: HouseMove
      # The same Outfit font files the Android app uses (one copy in the repo).
      - path: ../app/src/main/res/font
        name: Fonts
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: HouseMove
        PRODUCT_BUNDLE_IDENTIFIER: app.housemove.ios
        INFOPLIST_FILE: HouseMove/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
  HouseMoveUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: HouseMoveUITests
    dependencies:
      - target: HouseMove
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.housemove.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: HouseMove
schemes:
  HouseMove:
    build:
      targets:
        HouseMove: all
        HouseMoveUITests: [test]
    test:
      config: Debug
      targets:
        - HouseMoveUITests
    archive:
      config: Release
